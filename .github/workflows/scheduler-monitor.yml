
name: Mega Auction Scheduler Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.SCHEDULER_MONITOR_DATABASE_URL }}
      PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      CA_PEM: ${{ secrets.SCHEDULER_MONITOR_CA_PEM }}
      EXPECT_ENABLED: ${{ vars.SCHEDULER_EXPECT_ENABLED }}

    steps:
      - name: Install PostgreSQL client
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/monitor" \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            pg@8.23.0

      - name: Check scheduler health and report
        shell: bash
        run: |
          node <<'JS'
          const { Client } = require(
            process.env.RUNNER_TEMP + '/monitor/node_modules/pg'
          );

          const safeReason = (err) => {
            const allowed = [
              'DATABASE_SECRET_MISSING',
              'CA_SECRET_MISSING',
              'INVALID_DB_URL',
              'UNSAFE_LOGIN'
            ];

            if (allowed.includes(err?.message)) {
              return err.message;
            }

            if (
              typeof err?.code === 'string' &&
              /^[A-Z0-9_]{3,50}$/.test(err.code)
            ) {
              return err.code;
            }

            return 'CONNECTION_OR_QUERY_ERROR';
          };

          async function main() {
            let healthy = false;
            let client = null;
            let stage = 'CONFIGURATION';

            try {
              if (!process.env.DATABASE_URL) {
                throw Error('DATABASE_SECRET_MISSING');
              }

              if (!process.env.CA_PEM) {
                throw Error('CA_SECRET_MISSING');
              }

              stage = 'DATABASE_URL';

              const db = new URL(process.env.DATABASE_URL);

              if (
                !['postgres:', 'postgresql:'].includes(db.protocol) ||
                db.search ||
                db.hash
              ) {
                throw Error('INVALID_DB_URL');
              }

              stage = 'DATABASE_CONNECTION';

              client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: {
                  ca: process.env.CA_PEM,
                  rejectUnauthorized: true
                },
                connectionTimeoutMillis: 5000,
                query_timeout: 5000
              });

              await client.connect();

              stage = 'LOGIN_SECURITY';

              const role = await client.query(
                `SELECT
                  rolsuper OR
                  rolbypassrls OR
                  rolcreatedb OR
                  rolcreaterole AS elevated
                 FROM pg_roles
                 WHERE rolname = session_user`
              );

              if (role.rows[0]?.elevated !== false) {
                throw Error('UNSAFE_LOGIN');
              }

              stage = 'MONITOR_ROLE';

              await client.query('SET ROLE auction_monitor');
              await client.query(
                'SET default_transaction_read_only = on'
              );

              stage = 'HEALTH_QUERY';

              const result = await client.query(
                'SELECT public.auction_scheduler_health() AS health'
              );

              const h = result.rows[0]?.health;
              const expected =
                process.env.EXPECT_ENABLED === 'true';

              stage = 'HEALTH_VALIDATION';

              healthy =
                h?.schemaVersion === 1 &&
                h.owner === 'DATABASE' &&
                h.enabled === expected &&
                h.circuit === (expected ? 'CLOSED' : 'OPEN') &&
                h.stale === false &&
                h.unknownClaims === 0 &&
                h.quarantinedActions === 0 &&
                h.undeliveredAlerts === 0;

              console.log(
                healthy
                  ? 'Scheduler health check PASS'
                  : 'Scheduler health check FAILED'
              );

            } catch (err) {
              console.error(
                `Database health check failed at ${stage}: ${safeReason(err)}`
              );
            } finally {
              if (client) {
                await client.end().catch(() => {});
              }
            }

            try {
              if (!process.env.PING_URL) {
                throw Error('PING_SECRET_MISSING');
              }

              const ping = new URL(process.env.PING_URL);

              if (
                ping.protocol !== 'https:' ||
                ping.hostname !== 'hc-ping.com' ||
                ping.username ||
                ping.password ||
                ping.search ||
                ping.hash
              ) {
                throw Error('INVALID_PING_URL');
              }

              const pingUrl =
                ping.toString().replace(/\/$/, '') +
                (healthy ? '' : '/fail');

              const response = await fetch(pingUrl, {
                method: 'POST',
                redirect: 'error',
                signal: AbortSignal.timeout(8000)
              });

              if (!response.ok) {
                throw Error('PING_FAILED');
              }

              console.log(
                healthy
                  ? 'Healthchecks success ping sent'
                  : 'Healthchecks failure signal sent'
              );

            } catch {
              console.error(
                'Healthchecks notification failed'
              );
              process.exitCode = 1;
            }

            if (!healthy) {
              process.exitCode = 1;
            }
          }

          main().catch(() => {
            console.error('Unexpected monitoring failure');
            process.exitCode = 1;
          });
          JS
