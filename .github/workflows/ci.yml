name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: mega_auction_test
        ports:
          - 55325:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:55325/mega_auction_test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUCTION_TICK_SECRET: ci_test_auction_tick_secret_minimum_32_characters_length_ok

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: ESLint Audit
        run: npm run lint

      - name: Run Database Migrations
        run: |
          which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=postgrespassword sh scripts/ci-apply-migrations.sh

      - name: Database-Backed Integration Verification (Fail if Skipped)
        env:
          DISPOSABLE_TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:55325/mega_auction_test
        run: |
          npx vitest run \
            src/test/database/auction-rpc-concurrency.integration.test.ts \
            src/test/database/auction-rpc-security.integration.test.ts \
            --reporter=default \
            --reporter=json \
            --outputFile=db-test-results.json
          node scripts/verify-ci-db-test-results.mjs db-test-results.json
          rm -f db-test-results.json

      - name: Full Unit & Regression Suite (Vitest)
        run: npm run test:run

      - name: Build Application
        run: npm run build

      - name: Verify No Diagnostic Route in Production Manifest
        run: npm run check:no-diagnostic-route
